# Production stack on one server: MySQL, Redis, Kafka and the five GMart services.
#
#   cp .env.example .env      # fill in every value
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Only the gateway is published, and only on localhost:8080: put nginx (TLS) in front of it
# and of the frontend container (see GO-LIVE.md in the DemoGmart repo). The services and
# databases are reachable only on the internal "gmart" network.

x-service: &service
  restart: unless-stopped
  networks: [gmart]
  environment: &common-env
    JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set INTERNAL_TOKEN in .env}
    DB_HOST: mysql
    REDIS_HOST: redis
    KAFKA_SERVERS: kafka:9092
    USER_SERVICE_URL: http://user-service:8081/api
    CATALOG_SERVICE_URL: http://catalog-service:8082/api
    ORDER_SERVICE_URL: http://order-service:8083/api
    PAYMENT_SERVICE_URL: http://payment-service:8084/api

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    networks: [gmart]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:?}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:?}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      retries: 12

  redis:
    image: redis:7.4
    restart: unless-stopped
    networks: [gmart]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s

  kafka:
    image: apache/kafka:3.8.0
    restart: unless-stopped
    networks: [gmart]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes: [kafka-data:/var/lib/kafka/data]

  user-service:
    <<: *service
    build: { context: ., args: { SERVICE: user-service } }
    environment:
      <<: *common-env
      DB_USER: gmart_user
      DB_PASSWORD: ${USER_DB_PASSWORD}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on: { mysql: { condition: service_healthy } }
    healthcheck: &health
      # bash (not sh) is needed for /dev/tcp; the image has no curl/wget
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/$${PORT:-8081} && printf 'GET /api/actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 15s
      start_period: 90s
      retries: 5

  catalog-service:
    <<: *service
    build: { context: ., args: { SERVICE: catalog-service } }
    environment:
      <<: *common-env
      PORT: 8082
      DB_USER: gmart_catalog
      DB_PASSWORD: ${CATALOG_DB_PASSWORD}
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck: *health

  order-service:
    <<: *service
    build: { context: ., args: { SERVICE: order-service } }
    environment:
      <<: *common-env
      PORT: 8083
      DB_USER: gmart_order
      DB_PASSWORD: ${ORDER_DB_PASSWORD}
      DELIVERY_PROMISED_MINUTES: ${DELIVERY_PROMISED_MINUTES:-30}
      DELIVERY_RIDE_MINUTES: ${DELIVERY_RIDE_MINUTES:-20}
    depends_on:
      mysql: { condition: service_healthy }
      kafka: { condition: service_started }
    healthcheck: *health

  payment-service:
    <<: *service
    build: { context: ., args: { SERVICE: payment-service } }
    environment:
      <<: *common-env
      PORT: 8084
      DB_USER: gmart_payment
      DB_PASSWORD: ${PAYMENT_DB_PASSWORD}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:?set RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:?set RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
    depends_on: { mysql: { condition: service_healthy } }
    healthcheck: *health

  api-gateway:
    build: { context: ., args: { SERVICE: api-gateway } }
    restart: unless-stopped
    networks: [gmart]
    environment:
      USER_SERVICE_URI: http://user-service:8081
      CATALOG_SERVICE_URI: http://catalog-service:8082
      ORDER_SERVICE_URI: http://order-service:8083
      PAYMENT_SERVICE_URI: http://payment-service:8084
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"   # nginx on the same host proxies /api/** here
    depends_on:
      user-service: { condition: service_healthy }
      catalog-service: { condition: service_healthy }
      order-service: { condition: service_healthy }
      payment-service: { condition: service_healthy }

networks:
  gmart:
    name: gmart

volumes:
  mysql-data:
  redis-data:
  kafka-data:
