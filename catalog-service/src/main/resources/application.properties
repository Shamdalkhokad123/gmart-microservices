# catalog-service - see ../README.md for how the services fit together
server.port=${PORT:8082}
server.servlet.context-path=/api
spring.application.name=catalog-service

# --- MySQL (Docker container "mysql" from C:\Users\ksham\dev-services). Own database per service.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/gmart_catalog_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Shared by all services (must match) ---
gmart.app.jwtSecret=${JWT_SECRET:GmartSecretKeyForJwtTokenSigningMustBeVeryLongAndSecure2026SuperKey}
gmart.app.jwtExpirationMs=86400000
gmart.internal.token=${INTERNAL_TOKEN:gmart-internal-dev-token}

# --- Other services (internal APIs) ---
gmart.services.user-url=${USER_SERVICE_URL:http://localhost:8081/api}
gmart.services.catalog-url=${CATALOG_SERVICE_URL:http://localhost:8082/api}
gmart.services.order-url=${ORDER_SERVICE_URL:http://localhost:8083/api}
gmart.services.payment-url=${PAYMENT_SERVICE_URL:http://localhost:8084/api}

# --- Redis cache (Docker container "redis") ---
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379
spring.cache.type=redis
spring.data.redis.repositories.enabled=false
