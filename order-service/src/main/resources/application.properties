# order-service - see ../README.md for how the services fit together
server.port=${PORT:8083}
server.servlet.context-path=/api
spring.application.name=order-service

# --- MySQL (Docker container "mysql" from C:\Users\ksham\dev-services). Own database per service.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/gmart_order_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Shared by all services (must match) ---
gmart.app.jwtSecret=${JWT_SECRET:GmartSecretKeyForJwtTokenSigningMustBeVeryLongAndSecure2026SuperKey}
gmart.app.jwtExpirationMs=86400000
gmart.internal.token=${INTERNAL_TOKEN:gmart-internal-dev-token}

# --- Other services (internal APIs) ---
gmart.services.user-url=${USER_SERVICE_URL:http://localhost:8081/api}
gmart.services.catalog-url=${CATALOG_SERVICE_URL:http://localhost:8082/api}
gmart.services.order-url=${ORDER_SERVICE_URL:http://localhost:8083/api}
gmart.services.payment-url=${PAYMENT_SERVICE_URL:http://localhost:8084/api}

# --- Kafka (Docker container "kafka") ---
spring.kafka.bootstrap-servers=${KAFKA_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.group-id=gmart-order-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
gmart.kafka.topic.orders=gmart.orders
gmart.kafka.topic.order-status=gmart.order-status
