# Offline profile: no Docker needed. Run with -Dspring-boot.run.profiles=h2
spring.datasource.url=jdbc:h2:mem:gmart_order_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Kafka disabled (the store auto-confirms orders after 15 s instead)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
gmart.kafka.enabled=false

# In-memory database for quick local runs: Hibernate creates the schema, Flyway (MySQL scripts) is skipped
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
