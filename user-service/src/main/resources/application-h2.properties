# Offline profile: no Docker needed. Run with -Dspring-boot.run.profiles=h2
spring.datasource.url=jdbc:h2:mem:gmart_user_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# In-memory database for quick local runs: Hibernate creates the schema, Flyway (MySQL scripts) is skipped
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
