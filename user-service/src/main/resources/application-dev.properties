# Local development only (activated by -Dspring-boot.run.profiles=dev or h2).
# These values are public: never use the dev profile in production.
gmart.app.jwtSecret=${JWT_SECRET:gmart-dev-jwt-secret-not-for-production-0123456789abcdef}
gmart.internal.token=${INTERNAL_TOKEN:gmart-internal-dev-token}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# Demo customers, admin (admin / 12345678), employees and addresses
gmart.seed.demo-data=true
