# payment-service - see ../README.md for how the services fit together
server.port=${PORT:8084}
server.servlet.context-path=/api
spring.application.name=payment-service

# 'h2' (offline) always runs with the dev settings below
spring.profiles.group.h2=dev

# --- MySQL (Docker container "mysql" from C:\Users\ksham\dev-services). Own database per service.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/gmart_payment_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only checks it matches
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jpa.open-in-view=false

# --- Shared by all services (must match). Required in production: the service refuses
# to start without strong values. Local development uses the dev profile instead.
gmart.app.jwtSecret=${JWT_SECRET}
# Login lifetime (default 12 hours)
gmart.app.jwtExpirationMs=${JWT_EXPIRATION_MS:43200000}
gmart.internal.token=${INTERNAL_TOKEN}

# --- Other services (internal APIs) ---
gmart.services.user-url=${USER_SERVICE_URL:http://localhost:8081/api}
gmart.services.catalog-url=${CATALOG_SERVICE_URL:http://localhost:8082/api}
gmart.services.order-url=${ORDER_SERVICE_URL:http://localhost:8083/api}
gmart.services.payment-url=${PAYMENT_SERVICE_URL:http://localhost:8084/api}
gmart.services.store-url=${STORE_SERVICE_URL:http://localhost:8085/api}

# --- Razorpay ---
# Test keys: https://dashboard.razorpay.com/app/keys (Test mode). Set the secret as an env var; never commit it.
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
# Webhook URL: https://<public-host>/api/payments/razorpay/webhook (events: payment.captured, order.paid)
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
razorpay.currency=INR
razorpay.store-name=GMart

# --- Monitoring (reachable only inside the private network; the gateway doesn't route /api/actuator) ---
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.metrics.tags.application=${spring.application.name}
# Every log line carries the request id set by the gateway (X-Request-Id)
logging.pattern.level=%5p [%X{requestId:-}]
